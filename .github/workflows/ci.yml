name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build (native)
        run: go build ./...

      - name: go test (race)
        run: go test ./... -race -cover

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build-matrix:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./...

  e2e:
    name: end-to-end (privileged Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -t airlock-dev .

      - name: Run E2E suite
        # --cgroupns=host: with Docker's own default (--cgroupns=private),
        # airlock's tryCreateChildCgroup (container/cgroups.go) failed to
        # delegate the memory/cpu controllers in every environment tested
        # so far — including here, not just nested dev sandboxes. Root
        # cause: a private cgroup namespace gives this container a
        # pre-scoped view of /sys/fs/cgroup rooted at its OWN cgroup, and
        # nothing had delegated controllers into THAT root's own
        # subtree_control for it to hand further down. --cgroupns=host
        # instead gives it the real host cgroup hierarchy directly.
        # Confirmed locally: this alone turns the "could not create a
        # delegated child cgroup" skip into the memory limit genuinely
        # constraining a container (killed well inside a 10s bound under
        # --memory 16m, instead of running unconstrained the whole time).
        run: docker run --rm --privileged --cgroupns=host airlock-dev bash /app/test_e2e.sh
